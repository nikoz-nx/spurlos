# Baut Spurlos.app auf einem Mac von GitHub.
# - bei jeder Änderung: App bauen, prüfen und als Download im Lauf ablegen
# - bei einem Versions-Tag (z. B. v0.1.6): zusätzlich eine öffentliche Veröffentlichung mit DMG
name: Mac-App bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-app.txt

      - name: Tests
        run: |
          python tests/test_classify.py
          python -m spurlos.desktop --selftest

      - name: Hilfsprogramm für Apple Intelligence bauen
        continue-on-error: true
        run: |
          mkdir -p build-helper
          xcrun swiftc -O -parse-as-library -target arm64-apple-macos26 spurlos/helpers/spurlos_fm.swift -o build-helper/spurlos-fm

      - name: App bauen
        run: python -m PyInstaller --noconfirm --clean packaging/Spurlos.spec

      # Feste Unterschrift: Mit immer demselben Zertifikat erkennt macOS jede neue Version
      # als dieselbe App. Der Schlüsselbund fragt dann nur einmal, nicht nach jedem Update.
      # Ohne die geheimen Einstellungen (z. B. bei Kopien des Projekts) wird nur ad hoc signiert.
      - name: Zertifikat für die Unterschrift laden
        id: cert
        env:
          P12_BASE64: ${{ secrets.SPURLOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.SPURLOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::Kein Signatur-Zertifikat hinterlegt (SPURLOS_SIGN_P12). Ad-hoc-Signatur: der Schlüsselbund fragt nach jedem Update neu."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/spurlos-sign.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/sign.p12"
          HASH=$(security find-certificate -c "Spurlos" -Z "$KC" | awk '/SHA-1 hash:/ {print $3; exit}')
          echo "Zertifikat: $HASH"
          echo "identity=$HASH" >> "$GITHUB_OUTPUT"

      - name: Hilfsprogramm einfügen und signieren
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          if [ -x build-helper/spurlos-fm ]; then
            codesign --force --sign "$IDENTITY" build-helper/spurlos-fm
            cp build-helper/spurlos-fm dist/Spurlos.app/Contents/MacOS/
          fi
          codesign --force --deep --sign "$IDENTITY" dist/Spurlos.app
          codesign --verify --deep --verbose=2 dist/Spurlos.app
          codesign --display --requirements - dist/Spurlos.app
          lipo -info dist/Spurlos.app/Contents/MacOS/Spurlos

      - name: Fertige App prüfen
        env:
          SPURLOS_SELFTEST_NET: "1"
        run: dist/Spurlos.app/Contents/MacOS/Spurlos --selftest

      - name: Mindest-macOS der fertigen App ausgeben
        run: |
          echo "Hauptprogramm:"; vtool -show-build dist/Spurlos.app/Contents/MacOS/Spurlos | grep -E "minos|platform" || true
          echo "Höchstes minos in Frameworks/Bibliotheken:"
          find dist/Spurlos.app -type f \( -name "*.dylib" -o -name "*.so" -o -path "*/Versions/*/Python*" \) -print0 2>/dev/null \
            | xargs -0 -n1 vtool -show-build 2>/dev/null | awk '/minos/ {print $2}' | sort -V | tail -1
          echo "Info.plist LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/Spurlos.app/Contents/Info.plist)"

      - name: DMG erstellen
        run: |
          VERSION=$(python -c "import spurlos; print(spurlos.__version__)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir dmg
          cp -R dist/Spurlos.app dmg/
          ln -s /Applications dmg/Applications
          cp packaging/erster-start.html "dmg/Erster Start – bitte lesen.html"
          hdiutil create -volname "Spurlos" -srcfolder dmg -ov -format UDZO "Spurlos-$VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Spurlos-${{ env.VERSION }}
          path: Spurlos-*.dmg
          retention-days: 30

      - name: Veröffentlichen (nur bei Versions-Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Spurlos-*.dmg \
            --title "Spurlos $VERSION" \
            --notes "Spurlos $VERSION für Macs mit Apple-Chip (M1 und neuer). Installation: DMG öffnen, Spurlos in den Ordner Programme ziehen. Beim ersten Start unter Systemeinstellungen › Datenschutz & Sicherheit auf „Dennoch öffnen“ klicken."
